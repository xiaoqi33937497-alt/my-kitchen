name: Deploy kitchen app to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Public API Gateway address only. The private AI credential stays in veFaaS.
  VITE_RECEIPT_API_URL: https://slfk9q6h8elii55q8bbuu.apigateway-cn-beijing.volceapi.com

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Validate receipt API URL
        run: |
          case "$VITE_RECEIPT_API_URL" in
            https://*) ;;
            *) echo "VITE_RECEIPT_API_URL must be configured as an HTTPS GitHub Actions variable"; exit 1 ;;
          esac
      - run: pnpm build
      - run: pnpm check:secrets
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
